version: 1

filesystem_policy:
  include_workdir: false
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc/group
    - /etc/host.conf
    - /etc/hosts
    - /etc/ld.so.cache
    - /etc/ld.so.conf
    - /etc/ld.so.conf.d
    - /etc/nsswitch.conf
    - /etc/passwd
    - /etc/profile
    - /etc/resolv.conf
    - /etc/ssl
    - /workspace/base
    - /workspace/input
    - /workspace/project
  read_write:
    - /sandbox
    - /home/sandbox
    - /tmp
    - /dev/null
    - /dev/pts

landlock:
  compatibility: hard_requirement

network_policies: {}
